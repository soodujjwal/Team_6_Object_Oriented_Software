[project]
name = "personal-finance-manager-backend"
version = "0.1.0"
description = "FastAPI backend for the Team 6 Personal Finance Manager."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "PyJWT[crypto]>=2.9.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.0",
  "sqlalchemy>=2.0.30",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
