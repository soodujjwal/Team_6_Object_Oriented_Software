// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    // An explicit override is retained for CI. Windows Studio/CLI builds use
    // the local cache root selected in settings.gradle by default.
    if (rootProject.hasProperty('financeBuildRoot')) {
        layout.buildDirectory.set(new File(rootProject.file(rootProject.property('financeBuildRoot')), project.name))
    } else if (gradle.ext.has('financeDefaultBuildRoot')) {
        layout.buildDirectory.set(new File(gradle.ext.financeDefaultBuildRoot, project.name))
    }
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete allprojects.collect { it.layout.buildDirectory }
}
